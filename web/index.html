<!DOCTYPE html>
<html lang="en">
<meta name="build" content="cycle-7">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordKit - Instagram Story Slide Creator</title>
    <style>
        @font-face {
            font-family: 'LiberationSans';
            src: url('LiberationSans-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'LiberationSans', sans-serif;
            background: #1a1a1a;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            gap: 0;
        }

        .left-column {
            display: none;
        }

        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .slides-panel {
            background: #2a2a2a;
            padding: 12px 16px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .slides-panel h2 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slides-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 0;
        }

        .slide-tab {
            padding: 6px 12px;
            border: 1px solid #555;
            background: #1a1a1a;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            transition: all 0.15s;
        }

        .slide-tab:hover {
            border-color: #777;
            background: #2a2a2a;
        }

        .slide-tab.active {
            background: #fff;
            color: #1a1a1a;
            border-color: #fff;
        }

        .slides-controls {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-add-slide {
            padding: 6px 12px;
            background: #228B22;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add-slide:hover {
            background: #1a6b1a;
        }

        .btn-remove-slide {
            padding: 6px 12px;
            background: #cc3333;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-remove-slide:hover {
            background: #bb2222;
        }

        .btn-remove-slide:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .input-section {
            display: none;
        }

        .input-section.visible {
            display: none;
        }

        .input-section h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 300px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn-download:disabled {
            background: #555;
            cursor: not-allowed;
            color: #999;
        }

        .preview-section {
            background: #1a1a1a;
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-section h2 {
            display: none;
        }

        .palette-controls {
            margin: 0;
            padding: 12px 16px;
            background: #2a2a2a;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .palette-controls label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .palette-swatches {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
        }

        .swatch:hover {
            transform: scale(1.08);
            border-color: #666;
        }

        .swatch.active {
            border-color: #fff;
            box-shadow: 0 0 0 1px #fff, 0 0 0 3px #1a1a1a;
        }

        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        #canvas {
            border: none;
            background: #1a1a1a;
            max-width: 100%;
            height: auto;
            image-rendering: auto;
            image-rendering: crisp-edges;
            cursor: text;
            display: block;
        }

        .edit-overlay {
            position: absolute;
            background: transparent;
            border: 1px solid rgba(255, 255, 0, 0.3);
            border-radius: 0;
            padding: 0;
            z-index: 1500;
            box-shadow: none;
            display: none;
            outline: none;
            font-family: 'LiberationSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            caret-color: #ffff00;
            line-height: 1;
        }

        .edit-overlay.visible {
            display: block;
        }

        .edit-overlay input,
        .edit-overlay textarea {
            display: none;
        }

        .edit-overlay textarea {
            display: none;
        }

        .edit-overlay .edit-buttons {
            display: none;
        }

        .edit-overlay button {
            display: none;
        }

        .edit-overlay .save-btn {
            display: none;
        }

        .info {
            display: none;
        }

        .button-group {
            padding: 12px 16px;
            background: #2a2a2a;
            border-top: 1px solid #444;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .button-group button {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 3px;
            background: #1a1a1a;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }

        .button-group button:hover {
            background: #333;
            border-color: #777;
        }

        .btn-download {
            background: #444;
            color: #ccc;
        }

        .btn-download:hover {
            background: #555;
        }

        .btn-download-all {
            background: #228B22;
            color: white;
            border-color: #1a6b1a;
        }

        .btn-download-all:hover {
            background: #1a6b1a;
        }

        .btn-clear {
            background: #444;
            color: #ccc;
        }

        .btn-clear:hover {
            background: #555;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .slides-panel {
                order: 2;
            }

            .preview-section {
                order: 1;
            }

            .palette-swatches {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-column"></div>

        <div class="right-column">
            <div class="slides-panel">
                <h2>Slides</h2>
                <div class="slides-nav" id="slidesNav"></div>
                <div class="slides-controls">
                    <button class="btn-add-slide" id="addSlideBtn">+ Slide</button>
                    <button class="btn-remove-slide" id="removeSlideBtn">Remove</button>
                </div>
            </div>

            <div class="palette-controls">
                <label>Background</label>
                <div class="palette-swatches" id="paletteSwatches"></div>
            </div>

            <div class="preview-section">
                <h2>Canvas</h2>
                <div class="canvas-wrapper">
                    <canvas id="canvas"></canvas>
                    <div class="edit-overlay" id="titleOverlay" contenteditable="true"></div>
                    <div class="edit-overlay" id="bodyOverlay" contenteditable="true"></div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-download" id="downloadBtn">Download</button>
                <button class="btn-download-all" id="downloadAllBtn">Download All</button>
                <button class="btn-clear" id="clearBtn">Clear</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Configuration =====
        const CONFIG = {
            SLIDE_WIDTH: 1080,
            SLIDE_HEIGHT: 1920,
            BACKGROUND_COLOR: '#1a1a1a',
            TEXT_COLOR: '#ffffff',
            PADDING: 60,
            TITLE_FONT_SIZE: 60,
            BODY_FONT_SIZE: 36,
            LINE_SPACING: 1.5,
            FONT_FAMILY: '"LiberationSans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
        };

        // Background palette options
        const PALETTE = [
            { name: 'Dark', color: '#1a1a1a' },
            { name: 'Navy', color: '#0a1428' },
            { name: 'Gradient: Aurora', gradient: { from: '#1a1a2e', to: '#16213e' } },
            { name: 'Gradient: Sunset', gradient: { from: '#2c1810', to: '#5d4a3a' } },
            { name: 'Deep Purple', color: '#2d1b69' },
            { name: 'Teal', color: '#0d4f4f' },
            { name: 'Gradient: Ocean', gradient: { from: '#0a1428', to: '#1f4d8c' } },
            { name: 'Forest Green', color: '#1a3a1a' }
        ];

        // ===== Slide State Management =====
        let slides = [];
        let currentSlideIndex = 0;
        let currentBackgroundColor = CONFIG.BACKGROUND_COLOR;

        function initializeSlides() {
            if (slides.length === 0) {
                slides.push({ title: '', body: '', backgroundColor: CONFIG.BACKGROUND_COLOR });
                currentSlideIndex = 0;
            }
        }

        function getCurrentSlide() {
            return slides[currentSlideIndex] || { title: '', body: '', backgroundColor: CONFIG.BACKGROUND_COLOR };
        }

        function updateCurrentSlide(title, body, backgroundColor) {
            if (!slides[currentSlideIndex]) {
                slides[currentSlideIndex] = {};
            }
            slides[currentSlideIndex].title = title;
            slides[currentSlideIndex].body = body;
            slides[currentSlideIndex].backgroundColor = backgroundColor || CONFIG.BACKGROUND_COLOR;
        }

        // ===== DOM Elements =====
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const clearBtn = document.getElementById('clearBtn');
        const addSlideBtn = document.querySelectorAll('#addSlideBtn');
        const removeSlideBtn = document.querySelectorAll('#removeSlideBtn');
        const slidesNav = document.querySelectorAll('#slidesNav');
        const paletteSwatches = document.getElementById('paletteSwatches');

        // Edit overlay elements
        const titleOverlay = document.getElementById('titleOverlay');
        const bodyOverlay = document.getElementById('bodyOverlay');

        // Set canvas to full resolution
        canvas.width = CONFIG.SLIDE_WIDTH;
        canvas.height = CONFIG.SLIDE_HEIGHT;

        // Initialize slides
        initializeSlides();

        // ===== Utility Functions =====

        /**
         * Measure text width in the current canvas context.
         * Accounts for font configuration already set on ctx.
         */
        function measureText(text) {
            return ctx.measureText(text).width;
        }

        /**
         * Wrap text by pixel width, not character count.
         * Returns an array of wrapped lines.
         */
        function wrapTextByPixels(text, maxWidth) {
            const words = text.split(/\s+/);
            const lines = [];
            let currentLine = [];

            for (const word of words) {
                const testLine = currentLine.length === 0
                    ? word
                    : currentLine.join(' ') + ' ' + word;
                const lineWidth = measureText(testLine);

                if (lineWidth <= maxWidth) {
                    currentLine.push(word);
                } else {
                    if (currentLine.length > 0) {
                        lines.push(currentLine.join(' '));
                    }
                    currentLine = [word];
                }
            }

            if (currentLine.length > 0) {
                lines.push(currentLine.join(' '));
            }

            return lines;
        }

        /**
         * Parse markdown formatting in a line.
         * Returns an array of { text, bold, italic } objects.
         */
        function parseMarkdownLine(text) {
            const segments = [];
            let i = 0;
            let currentText = '';
            let currentBold = false;
            let currentItalic = false;

            while (i < text.length) {
                // Check for **bold**
                if (i < text.length - 1 && text.substring(i, i + 2) === '**') {
                    if (currentText) {
                        segments.push({
                            text: currentText,
                            bold: currentBold,
                            italic: currentItalic
                        });
                        currentText = '';
                    }
                    currentBold = !currentBold;
                    i += 2;
                }
                // Check for *italic* (but not **)
                else if (text[i] === '*' && (i === 0 || text[i - 1] !== '*') && (i + 1 >= text.length || text[i + 1] !== '*')) {
                    if (currentText) {
                        segments.push({
                            text: currentText,
                            bold: currentBold,
                            italic: currentItalic
                        });
                        currentText = '';
                    }
                    currentItalic = !currentItalic;
                    i += 1;
                } else {
                    currentText += text[i];
                    i += 1;
                }
            }

            if (currentText) {
                segments.push({
                    text: currentText,
                    bold: currentBold,
                    italic: currentItalic
                });
            }

            return segments;
        }

        /**
         * Parse body text into lines, extracting bullets and markdown.
         * Returns an array of { text, isBullet, segments } objects.
         */
        function parseBodyText(body) {
            const lines = [];
            for (const line of body.split('\n')) {
                const trimmed = line.trim();
                let isBullet = false;
                let lineText = trimmed;

                if (trimmed.startsWith('- ')) {
                    isBullet = true;
                    lineText = trimmed.substring(2);
                }

                const segments = parseMarkdownLine(lineText);
                lines.push({
                    text: lineText,
                    isBullet,
                    segments
                });
            }
            return lines;
        }

        /**
         * Get the font string for canvas.
         * If bold is true, use a heavier weight by increasing font size slightly or using a different style.
         */
        function getFontString(fontSize, bold = false, italic = false) {
            let style = '';
            if (italic) style += 'italic ';
            if (bold) style += 'bold ';

            // Use slightly larger size for bold effect (since we can't guarantee bold variant)
            const adjSize = bold ? Math.round(fontSize * 1.1) : fontSize;
            return `${style}${adjSize}px ${CONFIG.FONT_FAMILY}`;
        }

        /**
         * Draw text with markdown formatting support.
         * Returns the x position after drawing.
         */
        function drawTextWithMarkdown(x, y, text, fontSize, color) {
            const segments = parseMarkdownLine(text);
            let currentX = x;

            for (const segment of segments) {
                ctx.font = getFontString(fontSize, segment.bold, segment.italic);
                ctx.fillStyle = color;
                ctx.textBaseline = 'top';
                ctx.fillText(segment.text, currentX, y);
                currentX += measureText(segment.text);
            }

            return currentX;
        }

        /**
         * Render a single slide to the canvas.
         * This function is used for both live preview and PNG export.
         */
        function renderSlide(title, body, backgroundColor) {
            // Clear canvas with background color or gradient
            const bgColor = backgroundColor || CONFIG.BACKGROUND_COLOR;

            if (bgColor.includes('gradient-')) {
                // Handle gradient backgrounds
                const gradientDef = bgColor.split('|');
                if (gradientDef.length === 3) {
                    const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.SLIDE_HEIGHT);
                    gradient.addColorStop(0, gradientDef[1]);
                    gradient.addColorStop(1, gradientDef[2]);
                    ctx.fillStyle = gradient;
                } else {
                    ctx.fillStyle = bgColor;
                }
            } else {
                ctx.fillStyle = bgColor;
            }
            ctx.fillRect(0, 0, CONFIG.SLIDE_WIDTH, CONFIG.SLIDE_HEIGHT);

            const x = CONFIG.PADDING;
            const maxWidth = CONFIG.SLIDE_WIDTH - 2 * CONFIG.PADDING;
            const availableHeight = CONFIG.SLIDE_HEIGHT - 2 * CONFIG.PADDING - 60;

            // ===== FIRST PASS: Measure content =====
            let contentHeight = 0;
            let titleWrappedLines = [];
            let bodyWrappedLines = [];

            if (title.trim()) {
                ctx.font = getFontString(CONFIG.TITLE_FONT_SIZE);
                titleWrappedLines = wrapTextByPixels(title.trim(), maxWidth);
                contentHeight += titleWrappedLines.length * (CONFIG.TITLE_FONT_SIZE * CONFIG.LINE_SPACING);
                contentHeight += CONFIG.PADDING / 2;
            }

            if (body.trim()) {
                ctx.font = getFontString(CONFIG.BODY_FONT_SIZE);
                const bodyLines = parseBodyText(body);
                for (const line of bodyLines) {
                    if (line.text.trim()) {
                        const bulletOffset = line.isBullet ? 40 : 0;
                        const wrapped = wrapTextByPixels(line.text, maxWidth - bulletOffset);
                        bodyWrappedLines.push({
                            lines: wrapped,
                            isBullet: line.isBullet
                        });
                        contentHeight += wrapped.length * (CONFIG.BODY_FONT_SIZE * CONFIG.LINE_SPACING);
                    }
                }
            }

            // Calculate starting y to center content vertically
            // Center on 960px (vertical midpoint of 1920px)
            let y = Math.max(CONFIG.PADDING, (CONFIG.SLIDE_HEIGHT - contentHeight) / 2);

            // ===== SECOND PASS: Draw content =====

            // Draw title (title does not support markdown, safe to use fillText directly)
            if (title.trim()) {
                ctx.font = getFontString(CONFIG.TITLE_FONT_SIZE);
                for (const line of titleWrappedLines) {
                    ctx.fillStyle = CONFIG.TEXT_COLOR;
                    ctx.textBaseline = 'top';
                    ctx.fillText(line, x, y);
                    y += CONFIG.TITLE_FONT_SIZE * CONFIG.LINE_SPACING;
                }
                y += CONFIG.PADDING / 2;
            }

            // Draw body
            if (body.trim()) {
                let truncated = false;
                for (const bodyLine of bodyWrappedLines) {
                    for (const wrapped of bodyLine.lines) {
                        // Truncation guard: test against actual canvas boundary
                        if (y + (CONFIG.BODY_FONT_SIZE * CONFIG.LINE_SPACING) > CONFIG.SLIDE_HEIGHT - CONFIG.PADDING) {
                            truncated = true;
                            continue;
                        }

                        // Draw bullet if needed
                        if (bodyLine.isBullet) {
                            ctx.font = getFontString(CONFIG.BODY_FONT_SIZE);
                            ctx.fillStyle = CONFIG.TEXT_COLOR;
                            ctx.textBaseline = 'top';
                            ctx.fillText('•', x + 20, y);
                        }

                        // Draw the text line with markdown support (user content must use helper)
                        drawTextWithMarkdown(x + (bodyLine.isBullet ? 40 : 0), y, wrapped, CONFIG.BODY_FONT_SIZE, CONFIG.TEXT_COLOR);
                        y += CONFIG.BODY_FONT_SIZE * CONFIG.LINE_SPACING;
                    }
                }

                if (truncated) {
                    // Draw truncation warning badge on the slide itself
                    const warningY = CONFIG.SLIDE_HEIGHT - 100;
                    const warningText = '⚠ Content truncated';
                    ctx.font = getFontString(20);
                    ctx.fillStyle = '#ff6b6b';
                    ctx.textBaseline = 'top';
                    const warningWidth = measureText(warningText) + 20;
                    ctx.fillRect(x, warningY, warningWidth, 40);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(warningText, x + 10, warningY + 8);

                    console.warn('Warning: Some content was truncated and did not fit on the slide.');
                }
            }
        }

        /**
         * Update the preview canvas in real time.
         * Seed with example content if both title and body are empty.
         */
        function updatePreview() {
            let title = titleOverlay.textContent;
            let body = bodyOverlay.textContent;

            // Seed with example content only on first load (empty canvas)
            if (!title.trim() && !body.trim()) {
                body = 'Hook your audience with a story that matters.\n\nMake sequences that resonate.';
            }

            renderSlide(title, body, currentBackgroundColor);
        }

        /**
         * Download a single slide as a PNG with a numbered filename.
         */
        function downloadSlide(slideIndex) {
            const slide = slides[slideIndex];
            let title = slide.title || '';
            let body = slide.body || '';
            let backgroundColor = slide.backgroundColor || CONFIG.BACKGROUND_COLOR;

            // Apply seed logic: only for empty canvas
            if (!title.trim() && !body.trim()) {
                body = 'Hook your audience with a story that matters.\n\nMake sequences that resonate.';
            }

            // Render to canvas (full resolution)
            renderSlide(title, body, backgroundColor);

            // Convert to blob and download with numbered filename (01, 02, 03, etc.)
            canvas.toBlob((blob) => {
                if (!blob) {
                    alert('Download failed — try again.');
                    return;
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                const slideNumber = String(slideIndex + 1).padStart(2, '0');
                link.download = `slide-${slideNumber}.png`;
                link.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        /**
         * Download all slides sequentially.
         */
        function downloadAllSlides() {
            let promise = Promise.resolve();
            slides.forEach((_, index) => {
                promise = promise.then(() => {
                    const slide = slides[index];
                    let title = slide.title || '';
                    let body = slide.body || '';
                    let backgroundColor = slide.backgroundColor || CONFIG.BACKGROUND_COLOR;

                    if (!title.trim() && !body.trim()) {
                        body = 'Hook your audience with a story that matters.\n\nMake sequences that resonate.';
                    }

                    renderSlide(title, body, backgroundColor);

                    return new Promise((resolve) => {
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                alert('Download failed — try again.');
                                resolve();
                                return;
                            }
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            const slideNumber = String(index + 1).padStart(2, '0');
                            link.download = `slide-${slideNumber}.png`;
                            link.click();
                            URL.revokeObjectURL(url);
                            resolve();
                        }, 'image/png');
                    });
                });
            });
        }

        /**
         * Update the slides navigator UI.
         */
        function updateSlidesNav() {
            slidesNav.forEach(nav => {
                nav.innerHTML = '';
                slides.forEach((_, index) => {
                    const tab = document.createElement('button');
                    tab.className = 'slide-tab' + (index === currentSlideIndex ? ' active' : '');
                    tab.textContent = String(index + 1);
                    tab.addEventListener('click', () => {
                        switchSlide(index);
                    });
                    nav.appendChild(tab);
                });
            });

            // Update button states
            removeSlideBtn.forEach(btn => {
                btn.disabled = slides.length <= 1;
            });
        }

        /**
         * Switch to a different slide.
         */
        function switchSlide(index) {
            // Save current slide state
            updateCurrentSlide(titleOverlay.textContent, bodyOverlay.textContent, currentBackgroundColor);

            // Switch to new slide
            currentSlideIndex = index;
            const slide = getCurrentSlide();
            titleOverlay.textContent = slide.title || '';
            bodyOverlay.textContent = slide.body || '';
            currentBackgroundColor = slide.backgroundColor || CONFIG.BACKGROUND_COLOR;

            // Hide overlays on slide switch
            hideOverlays();

            // Update UI
            updateSlidesNav();
            updatePaletteUI();
            updatePreview();
        }

        /**
         * Add a new slide.
         */
        function addSlide() {
            // Save current slide
            updateCurrentSlide(titleOverlay.textContent, bodyOverlay.textContent, currentBackgroundColor);

            // Create new slide
            slides.push({ title: '', body: '', backgroundColor: CONFIG.BACKGROUND_COLOR });
            currentSlideIndex = slides.length - 1;
            currentBackgroundColor = CONFIG.BACKGROUND_COLOR;

            // Update UI and overlays
            titleOverlay.textContent = '';
            bodyOverlay.textContent = '';
            hideOverlays();
            updateSlidesNav();
            updatePaletteUI();
            updatePreview();
        }

        /**
         * Remove the current slide.
         */
        function removeSlide() {
            if (slides.length <= 1) return;

            slides.splice(currentSlideIndex, 1);
            if (currentSlideIndex >= slides.length) {
                currentSlideIndex = slides.length - 1;
            }

            const slide = getCurrentSlide();
            titleOverlay.textContent = slide.title || '';
            bodyOverlay.textContent = slide.body || '';
            currentBackgroundColor = slide.backgroundColor || CONFIG.BACKGROUND_COLOR;

            hideOverlays();
            updateSlidesNav();
            updatePaletteUI();
            updatePreview();
        }

        /**
         * Clear all inputs for current slide.
         */
        function clearInputs() {
            titleOverlay.textContent = '';
            bodyOverlay.textContent = '';
            updateCurrentSlide('', '', currentBackgroundColor);
            hideOverlays();
            updatePreview();
        }

        /**
         * Initialize the background palette swatches.
         */
        function initializePalette() {
            paletteSwatches.innerHTML = '';
            PALETTE.forEach((paletteItem, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                if (paletteItem.gradient) {
                    const gradient = `linear-gradient(135deg, ${paletteItem.gradient.from}, ${paletteItem.gradient.to})`;
                    swatch.style.background = gradient;
                } else {
                    swatch.style.background = paletteItem.color;
                }
                swatch.title = paletteItem.name;
                if (paletteItem.color === currentBackgroundColor) {
                    swatch.classList.add('active');
                }

                swatch.addEventListener('click', () => {
                    currentBackgroundColor = paletteItem.color || `gradient-${paletteItem.gradient.from}|${paletteItem.gradient.to}`;
                    updatePaletteUI();
                    updatePreview();
                });

                paletteSwatches.appendChild(swatch);
            });
        }

        /**
         * Update palette UI to reflect current selection.
         */
        function updatePaletteUI() {
            document.querySelectorAll('.swatch').forEach(swatch => {
                swatch.classList.remove('active');
                if (swatch.style.backgroundColor && swatch.style.backgroundColor === currentBackgroundColor) {
                    swatch.classList.add('active');
                }
            });
        }

        /**
         * Position a contenteditable overlay at the given canvas-space coordinates.
         * The overlay is absolutely positioned within the canvas-wrapper.
         */
        function positionOverlay(overlay, canvasX, canvasY, width, height) {
            const canvasRect = canvas.getBoundingClientRect();
            const wrapperRect = canvas.parentElement.getBoundingClientRect();

            // Calculate position relative to canvas wrapper
            const relativeX = canvasX * (canvasRect.width / CONFIG.SLIDE_WIDTH);
            const relativeY = canvasY * (canvasRect.height / CONFIG.SLIDE_HEIGHT);
            const relativeWidth = width * (canvasRect.width / CONFIG.SLIDE_WIDTH);
            const relativeHeight = height * (canvasRect.height / CONFIG.SLIDE_HEIGHT);

            overlay.style.left = relativeX + 'px';
            overlay.style.top = relativeY + 'px';
            overlay.style.width = relativeWidth + 'px';
            overlay.style.height = relativeHeight + 'px';
            overlay.style.fontSize = (CONFIG.TITLE_FONT_SIZE * (canvasRect.width / CONFIG.SLIDE_WIDTH)) + 'px';
        }

        function positionBodyOverlay(overlay, canvasX, canvasY, width, height) {
            const canvasRect = canvas.getBoundingClientRect();

            // Calculate position relative to canvas wrapper
            const relativeX = canvasX * (canvasRect.width / CONFIG.SLIDE_WIDTH);
            const relativeY = canvasY * (canvasRect.height / CONFIG.SLIDE_HEIGHT);
            const relativeWidth = width * (canvasRect.width / CONFIG.SLIDE_WIDTH);
            const relativeHeight = height * (canvasRect.height / CONFIG.SLIDE_HEIGHT);

            overlay.style.left = relativeX + 'px';
            overlay.style.top = relativeY + 'px';
            overlay.style.width = relativeWidth + 'px';
            overlay.style.height = relativeHeight + 'px';
            overlay.style.fontSize = (CONFIG.BODY_FONT_SIZE * (canvasRect.width / CONFIG.SLIDE_WIDTH)) + 'px';
        }

        /**
         * Get the approximate canvas-relative pixel positions of title and body.
         */
        function getTitleClickRegion() {
            const x = CONFIG.PADDING;
            const maxWidth = CONFIG.SLIDE_WIDTH - 2 * CONFIG.PADDING;
            ctx.font = getFontString(CONFIG.TITLE_FONT_SIZE);
            const titleText = titleOverlay.textContent.trim();
            const titleWrappedLines = titleText
                ? wrapTextByPixels(titleText, maxWidth)
                : [];

            if (titleWrappedLines.length === 0) {
                return { x: CONFIG.PADDING, y: CONFIG.SLIDE_HEIGHT / 2 - 100, width: maxWidth, height: CONFIG.TITLE_FONT_SIZE };
            }

            let contentHeight = titleWrappedLines.length * (CONFIG.TITLE_FONT_SIZE * CONFIG.LINE_SPACING);
            let y = Math.max(CONFIG.PADDING, (CONFIG.SLIDE_HEIGHT - contentHeight) / 2);
            return { x, y, width: maxWidth, height: contentHeight };
        }

        function getBodyClickRegion() {
            const x = CONFIG.PADDING;
            const maxWidth = CONFIG.SLIDE_WIDTH - 2 * CONFIG.PADDING;
            let contentHeight = 0;
            let titleWrappedLines = [];
            let bodyWrappedLines = [];

            if (titleOverlay.textContent.trim()) {
                ctx.font = getFontString(CONFIG.TITLE_FONT_SIZE);
                titleWrappedLines = wrapTextByPixels(titleOverlay.textContent.trim(), maxWidth);
                contentHeight += titleWrappedLines.length * (CONFIG.TITLE_FONT_SIZE * CONFIG.LINE_SPACING);
                contentHeight += CONFIG.PADDING / 2;
            }

            if (bodyOverlay.textContent.trim()) {
                ctx.font = getFontString(CONFIG.BODY_FONT_SIZE);
                const bodyLines = parseBodyText(bodyOverlay.textContent);
                for (const line of bodyLines) {
                    if (line.text.trim()) {
                        const bulletOffset = line.isBullet ? 40 : 0;
                        const wrapped = wrapTextByPixels(line.text, maxWidth - bulletOffset);
                        bodyWrappedLines.push({ lines: wrapped, isBullet: line.isBullet });
                        contentHeight += wrapped.length * (CONFIG.BODY_FONT_SIZE * CONFIG.LINE_SPACING);
                    }
                }
            }

            let y = Math.max(CONFIG.PADDING, (CONFIG.SLIDE_HEIGHT - contentHeight) / 2);
            if (titleOverlay.textContent.trim()) {
                y += titleWrappedLines.length * (CONFIG.TITLE_FONT_SIZE * CONFIG.LINE_SPACING);
                y += CONFIG.PADDING / 2;
            }

            const bodyHeight = bodyWrappedLines.reduce((sum, bw) => sum + bw.lines.length * (CONFIG.BODY_FONT_SIZE * CONFIG.LINE_SPACING), 0);
            return { x, y, width: maxWidth, height: bodyHeight };
        }

        /**
         * Show the title edit overlay (transparent contenteditable div).
         */
        function showTitleOverlay() {
            const region = getTitleClickRegion();
            positionOverlay(titleOverlay, region.x, region.y, region.width, region.height);
            titleOverlay.classList.add('visible');
            titleOverlay.focus();
            // Move cursor to end
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(titleOverlay);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        /**
         * Show the body edit overlay (transparent contenteditable div).
         */
        function showBodyOverlay() {
            const region = getBodyClickRegion();
            positionBodyOverlay(bodyOverlay, region.x, region.y, region.width, region.height);
            bodyOverlay.classList.add('visible');
            bodyOverlay.focus();
            // Move cursor to end
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(bodyOverlay);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        /**
         * Hide all overlays.
         */
        function hideOverlays() {
            titleOverlay.classList.remove('visible');
            bodyOverlay.classList.remove('visible');
        }

        /**
         * Handle canvas clicks to trigger edit overlays.
         */
        function handleCanvasClick(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CONFIG.SLIDE_WIDTH / rect.width;
            const scaleY = CONFIG.SLIDE_HEIGHT / rect.height;
            const canvasX = (event.clientX - rect.left) * scaleX;
            const canvasY = (event.clientY - rect.top) * scaleY;

            const titleRegion = getTitleClickRegion();
            const bodyRegion = getBodyClickRegion();

            // Check if click is in title region
            if (titleOverlay.textContent.trim()) {
                if (canvasX > titleRegion.x && canvasY > titleRegion.y && canvasY < titleRegion.y + titleRegion.height) {
                    showTitleOverlay();
                    return;
                }
            }

            // Default to body edit (or show title if empty)
            if (bodyOverlay.textContent.trim()) {
                showBodyOverlay();
            } else {
                showTitleOverlay();
            }
        }

        // ===== Event Listeners =====
        // Title overlay input handler
        titleOverlay.addEventListener('input', () => {
            updateCurrentSlide(titleOverlay.textContent, bodyOverlay.textContent, currentBackgroundColor);
            updatePreview();
        });

        titleOverlay.addEventListener('blur', hideOverlays);

        titleOverlay.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideOverlays();
            }
        });

        // Body overlay input handler
        bodyOverlay.addEventListener('input', () => {
            updateCurrentSlide(titleOverlay.textContent, bodyOverlay.textContent, currentBackgroundColor);
            updatePreview();
        });

        bodyOverlay.addEventListener('blur', hideOverlays);

        bodyOverlay.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideOverlays();
            }
        });

        // Download and clear buttons
        downloadBtn.addEventListener('click', () => downloadSlide(currentSlideIndex));
        downloadAllBtn.addEventListener('click', downloadAllSlides);
        clearBtn.addEventListener('click', clearInputs);

        // Slide navigation
        addSlideBtn.forEach(btn => btn.addEventListener('click', addSlide));
        removeSlideBtn.forEach(btn => btn.addEventListener('click', removeSlide));

        // Canvas click handler
        canvas.addEventListener('click', handleCanvasClick);

        // Close overlays when clicking outside both overlays and canvas
        document.addEventListener('click', (e) => {
            if (!titleOverlay.contains(e.target) && !bodyOverlay.contains(e.target) && e.target !== canvas) {
                hideOverlays();
            }
        });

        // Initial render
        initializePalette();
        updateSlidesNav();
        updatePreview();
    </script>
</body>
</html>
